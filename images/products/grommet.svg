<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grommetGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Grommet -->
  <circle cx="100" cy="100" r="45" fill="url(#grommetGradient)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#FF6B35" stroke-width="3"/>
  <circle cx="100" cy="100" r="25" fill="#1a1a2e"/>
  
  <!-- Flange details -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="#2E8B57" stroke-width="4"/>
  <circle cx="100" cy="100" r="65" fill="none" stroke="#2E8B57" stroke-width="2" opacity="0.7"/>
  
  <!-- Cable representation -->
  <circle cx="100" cy="100" r="15" fill="none" stroke="#FF6B35" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Highlight -->
  <circle cx="85" cy="85" r="35" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Text -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2E8B57" font-weight="bold">Grommet</text>
</svg> 