<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="washerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Washer -->
  <circle cx="100" cy="100" r="50" fill="url(#washerGradient)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#FF6B35" stroke-width="3"/>
  <circle cx="100" cy="100" r="15" fill="#1a1a2e"/>
  
  <!-- Cross section lines -->
  <line x1="100" y1="35" x2="100" y2="65" stroke="#FF6B35" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="135" x2="100" y2="165" stroke="#FF6B35" stroke-width="2" opacity="0.7"/>
  <line x1="35" y1="100" x2="65" y2="100" stroke="#FF6B35" stroke-width="2" opacity="0.7"/>
  <line x1="135" y1="100" x2="165" y2="100" stroke="#FF6B35" stroke-width="2" opacity="0.7"/>
  
  <!-- Highlight -->
  <circle cx="85" cy="85" r="40" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Text -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2E8B57" font-weight="bold">Washer</text>
</svg> 