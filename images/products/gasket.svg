<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gasketGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Gasket -->
  <rect x="40" y="40" width="120" height="120" rx="15" fill="url(#gasketGradient)" filter="url(#shadow)"/>
  <rect x="50" y="50" width="100" height="100" rx="10" fill="none" stroke="#FF6B35" stroke-width="3"/>
  
  <!-- Inner holes -->
  <circle cx="70" cy="70" r="8" fill="#1a1a2e"/>
  <circle cx="130" cy="70" r="8" fill="#1a1a2e"/>
  <circle cx="70" cy="130" r="8" fill="#1a1a2e"/>
  <circle cx="130" cy="130" r="8" fill="#1a1a2e"/>
  
  <!-- Center hole -->
  <circle cx="100" cy="100" r="20" fill="#1a1a2e"/>
  
  <!-- Highlight -->
  <rect x="45" y="45" width="110" height="110" rx="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Text -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2E8B57" font-weight="bold">Gasket</text>
</svg> 