<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sealGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Seal -->
  <rect x="30" y="80" width="140" height="40" rx="20" fill="url(#sealGradient)" filter="url(#shadow)"/>
  <rect x="40" y="85" width="120" height="30" rx="15" fill="none" stroke="#FF6B35" stroke-width="2"/>
  
  <!-- Lip details -->
  <path d="M 50 85 Q 60 75 70 85 Q 80 95 90 85 Q 100 75 110 85 Q 120 95 130 85 Q 140 75 150 85" 
        fill="none" stroke="#FF6B35" stroke-width="2"/>
  <path d="M 50 115 Q 60 125 70 115 Q 80 105 90 115 Q 100 125 110 115 Q 120 105 130 115 Q 140 125 150 115" 
        fill="none" stroke="#FF6B35" stroke-width="2"/>
  
  <!-- Spring representation -->
  <path d="M 60 100 Q 70 90 80 100 Q 90 110 100 100 Q 110 90 120 100 Q 130 110 140 100" 
        fill="none" stroke="#1a1a2e" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Highlight -->
  <rect x="35" y="82" width="130" height="36" rx="18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Text -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2E8B57" font-weight="bold">Seal</text>
</svg> 